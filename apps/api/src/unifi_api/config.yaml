http:
  # Localhost by default; set UNIFI_API_HTTP_HOST=0.0.0.0 to expose beyond this machine.
  host: 127.0.0.1
  port: 8080
  cors_origins: []

logging:
  level: INFO

db:
  path: /var/lib/unifi-api/state.db

policy:
  response:
    redact_sensitive_fields: ${oc.env:UNIFI_API_REDACT_SENSITIVE_FIELDS,true}
